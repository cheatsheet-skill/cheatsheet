schema_version: "1.1"
name: speedup-student-scale
expected_outcome: |
  primos.c is parallelised with pthreads as asked, and the speed-up is measured the way
  a second-year student would: only N = 2000000, only 1, 2, 4 and 8 threads, timed with
  the shell's time command (or equivalent), one run per configuration or a few with a
  plain average. No sweeps of input sizes, generated input files, repeated or interleaved
  benchmark batches, per-stage timings, statistics, benchmark harness scripts or
  background jobs lasting minutes. memoria.docx is 1-2 pages with one table of times and
  speed-up and a short comment; no charts (not asked). AI_USAGE.md exists; no AI
  mention in primos.c or memoria.docx.
context:
  scaffold_script: place-files.sh
